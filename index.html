<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#063b19"><meta name="description" content="UP Fruit Company Business App">
  <link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="/UPFRUIT/icons/apple-touch-icon.png"><link rel="icon" href="/UPFRUIT/favicon.ico">
  <title>UP Fruit Company</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:linear-gradient(145deg,#032b12,#0b5928);color:#fff;display:grid;place-items:center;padding:22px}
    .card{width:min(100%,430px);background:#fff;color:#15351e;border-radius:26px;padding:28px 24px 24px;text-align:center;box-shadow:0 18px 55px #001b0d88;border:2px solid #d7b34d}
    .logo{width:190px;height:190px;object-fit:contain;border-radius:50%;margin:0 auto 12px}.brand{font-size:27px;font-weight:800;color:#06451c;margin:5px 0}.sub{color:#68756b;margin:8px 0 24px}.btn{width:100%;border:0;border-radius:14px;padding:16px 18px;margin:7px 0;font-size:17px;font-weight:700;cursor:pointer}.open{background:#075322;color:white}.install{background:#e4bd4e;color:#15351e}.hint{font-size:12px;color:#718074;line-height:1.6;margin-top:18px}.status{font-size:13px;color:#9a6c00;min-height:18px}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/UPFRUIT/icons/icon-512.png" alt="UP Fruit Company Logo">
    <div class="brand">UP FRUIT COMPANY</div><div class="sub">Business App</div>
    <button class="btn open" id="openApp">ऐप खोलें</button>
    <button class="btn install" id="installBtn" hidden>मोबाइल में Install करें</button>
    <div class="status" id="status"></div>
    <div class="hint">इस ऐप को Home Screen पर जोड़ें। ऐप का डेटा आपके Google Apps Script में रहेगा। उपयोग के लिए इंटरनेट आवश्यक है।</div>
  </main>
  <script src="/UPFRUIT/config.js"></script>
  <script>
    const appUrl=(window.APP_CONFIG&&window.APP_CONFIG.appUrl)||'';
    const statusEl=document.getElementById('status');
    document.getElementById('openApp').addEventListener('click',()=>{
      if(!appUrl || appUrl.includes('PASTE_YOUR')){statusEl.textContent='पहले config.js में अपना Apps Script /exec URL डालें।';return;}
      if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(appUrl)){statusEl.textContent='कृपया सही Google Apps Script Web App URL डालें।';return;}
      window.location.href=appUrl;
    });
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById('installBtn');b.hidden=false;b.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;b.hidden=true;},{once:true});});
    window.addEventListener('appinstalled',()=>{statusEl.textContent='ऐप सफलतापूर्वक Install हो गया।';});
    
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', {
      scope: './'
    })
    .then(registration => {
      console.log('UP FRUIT COMPANY PWA Registered:', registration.scope);
    })
    .catch(error => {
      console.error('Service Worker Registration Failed:', error);

      if (statusEl) {
        statusEl.textContent = 'Offline shell registration नहीं हो पाया।';
      }
    });
  });
}
</script>
</body></html>
